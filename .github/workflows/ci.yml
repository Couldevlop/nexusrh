name: Quality & Security — NexusRH CI

# Déclenchement sans doublon.
#
# Une branche de travail qui porte une PR recevait DEUX exécutions pour le même
# commit : une sur `push` (feat/**, fix/**…) et une sur `pull_request`. Même
# SHA, mêmes tests, deux fois le temps de calcul — et chaque contrôle affiché
# en double dans la PR.
#
# `push` ne garde donc que les branches durables (main, develop), où un commit
# peut arriver sans PR et où le contenu fusionné diffère de la tête de la PR.
# Les branches de travail sont couvertes par `pull_request`, qui teste la
# fusion prévue : c'est ce qui compte avant de fusionner.
on:
  push:
    branches: [ main, develop ]
    paths: [ 'nexusrh_ci/**', '.github/workflows/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'nexusrh_ci/**', '.github/workflows/**' ]

# Une poussée en remplace une autre sur la même référence : seul le dernier
# état est intéressant. Jamais sur main — un commit fusionné n'est pas annulé.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.1.0'

jobs:
  quality:
    name: TypeScript & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexusrh_ci # Force l'exécution dans le dossier CI
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with: { version: '${{ env.PNPM_VERSION }}' }
    - uses: actions/setup-node@v4
      with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: nexusrh_ci/pnpm-lock.yaml }

    - run: pnpm install --frozen-lockfile
    - run: pnpm run typecheck
    - run: pnpm run test

  security-scan:
    name: SAST & Secrets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }

    # Audit des dépendances
    - name: Dependency Audit
      run: cd nexusrh_ci && pnpm audit --audit-level=high || true

    # Scan Trivy (Code source)
    - name: SAST — Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './nexusrh_ci'
        format: 'sarif'
        output: 'trivy-fs.sarif'
        severity: 'CRITICAL,HIGH'

    # Un run dont la branche a été supprimée entre-temps ne peut plus rattacher
    # son SARIF à une référence git : l'upload échoue alors que l'analyse Trivy,
    # elle, a bien tourné. On ne fait plus échouer le workflow pour ce motif.
    - id: sarif
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-fs.sarif'
        category: trivy-filesystem

    # Non bloquant, mais jamais silencieux : un upload raté reste visible dans le
    # résumé du run, sinon la remontée vers Code Scanning pourrait disparaître
    # sans que personne ne s'en aperçoive.
    - name: Signaler un upload SARIF manqué
      if: always() && steps.sarif.outcome == 'failure'
      run: |
        echo "::warning::L'upload SARIF a échoué — les résultats Trivy ne sont pas remontés dans Code Scanning pour ce run."
        echo "L'upload SARIF a échoué : résultats Trivy absents de Code Scanning." >> "$GITHUB_STEP_SUMMARY"
