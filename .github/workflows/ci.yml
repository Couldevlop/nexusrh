name: Quality & Security — NexusRH CI

# Déclenchement sans doublon.
#
# Une branche qui porte une PR ouverte reçoit DEUX événements pour le MÊME
# commit : `push` sur la branche, et `pull_request` sur la PR. Même SHA, mêmes
# tests, deux fois le temps de calcul — et chaque contrôle affiché en double.
#
# Le cas vaut pour les branches de travail comme pour `develop`, qui porte en
# permanence la PR vers `main` : garder `develop` dans `push` suffisait à
# reproduire le doublon à chaque fusion.
#
# `push` ne garde donc que `main`, seule branche dont le contenu n'est jamais
# couvert par une PR ouverte. Tout le reste passe par `pull_request`, qui teste
# la FUSION prévue — c'est l'état qui compte avant de fusionner.
on:
  push:
    branches: [ main ]
    paths: [ 'nexusrh_ci/**', '.github/workflows/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'nexusrh_ci/**', '.github/workflows/**' ]

# Une poussée en remplace une autre sur la même référence : seul le dernier
# état est intéressant. Jamais sur main — un commit fusionné n'est pas annulé.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.1.0'

jobs:
  quality:
    name: TypeScript & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexusrh_ci # Force l'exécution dans le dossier CI
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with: { version: '${{ env.PNPM_VERSION }}' }
    - uses: actions/setup-node@v4
      with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: nexusrh_ci/pnpm-lock.yaml }

    - run: pnpm install --frozen-lockfile
    - run: pnpm run typecheck
    - run: pnpm run test

  security-scan:
    name: SAST & Secrets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }
    - uses: pnpm/action-setup@v3
      with: { version: '${{ env.PNPM_VERSION }}' }
    - uses: actions/setup-node@v4
      with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: nexusrh_ci/pnpm-lock.yaml }

    # ── Secrets en clair — BLOQUANT ──────────────────────────────────────────
    #
    # Ce job s'appelait « SAST & Secrets » et ne cherchait NI l'un NI l'autre :
    # `pnpm audit || true` ne peut pas échouer, et Trivy en mode `fs` ne lit pas
    # le code applicatif. Résultat : la clé de signature des jetons de
    # production, la clé de chiffrement des NNI/IBAN et le mot de passe
    # PostgreSQL sont restés en clair dans `k8s/setup-cluster.sh`, sur un dépôt
    # PUBLIC, du 07/06/2026 au 26/11/2026 — six mois sans que rien ne le voie.
    #
    # Le détecteur est l'invariant du dépôt (`secrets-hors-depot.golden.test.ts`)
    # plutôt qu'une action tierce : pas de jeton de licence à gérer, pas de
    # dépendance d'approvisionnement supplémentaire dans un job qui détient
    # `security-events: write`, et il tourne aussi en local avant la poussée.
    - name: Install (invariant secrets)
      run: cd nexusrh_ci && pnpm install --frozen-lockfile
    - name: Secrets en clair dans un fichier versionné
      run: cd nexusrh_ci/apps/api && npx vitest run src/secrets-hors-depot.golden.test.ts

    # ── Dépendances vulnérables — BLOQUANT à partir de « high » ──────────────
    # Le `|| true` est retiré : une faille haute ou critique doit arrêter la
    # chaîne, sinon l'audit n'est qu'une ligne de journal que personne ne lit.
    # Le seuil reste `high` pour ne pas bloquer sur une alerte modérée non
    # exploitable ici (au 26/11/2026 : i18next, pollution de prototype).
    - name: Dependency Audit
      run: cd nexusrh_ci && pnpm audit --audit-level=high

    # Scan Trivy (Code source)
    # Épinglé sur un CONDENSAT (v0.36.0) : `@master` est une référence mutable,
    # et ce job détient `security-events: write`.
    - name: SAST — Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'fs'
        scan-ref: './nexusrh_ci'
        format: 'sarif'
        output: 'trivy-fs.sarif'
        severity: 'CRITICAL,HIGH'

    # Un run dont la branche a été supprimée entre-temps ne peut plus rattacher
    # son SARIF à une référence git : l'upload échoue alors que l'analyse Trivy,
    # elle, a bien tourné. On ne fait plus échouer le workflow pour ce motif.
    - id: sarif
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-fs.sarif'
        category: trivy-filesystem

    # Non bloquant, mais jamais silencieux : un upload raté reste visible dans le
    # résumé du run, sinon la remontée vers Code Scanning pourrait disparaître
    # sans que personne ne s'en aperçoive.
    - name: Signaler un upload SARIF manqué
      if: always() && steps.sarif.outcome == 'failure'
      run: |
        echo "::warning::L'upload SARIF a échoué — les résultats Trivy ne sont pas remontés dans Code Scanning pour ce run."
        echo "L'upload SARIF a échoué : résultats Trivy absents de Code Scanning." >> "$GITHUB_STEP_SUMMARY"
