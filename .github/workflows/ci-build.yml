name: Build & Deploy — NexusRH CI

on:
  push:
    branches: [ main ]
    paths:
    - 'nexusrh_ci/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Cible de déploiement'
        required: true
        default: preprod
        type: choice
        options: [ preprod, production ]
      ignorer_les_tests:
        description: "Déployer SANS attendre les tests (urgence — à justifier)"
        required: false
        default: false
        type: boolean

# Deux déploiements ne se marchent pas dessus : le suivant attend le précédent.
# Jamais d'annulation — un déploiement interrompu en plein `rollout` laisse le
# cluster entre deux versions.
concurrency:
  group: deploy-nexusrh-ci
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Le déploiement attend les tests du MÊME commit ─────────────────────────
  #
  # Jusqu'ici, « Build & Deploy » et « Quality & Security » partaient en
  # parallèle sur un push `main` : rien n'empêchait un commit aux tests rouges
  # d'arriver en production, et l'échec des tests n'était constaté qu'après.
  #
  # Pourquoi attendre le run de `ci.yml` plutôt que rejouer les tests ici :
  # les deux workflows se déclenchent sur le même push, donc rejouer
  # typecheck + 6 500 tests dans ce workflow les exécuterait DEUX fois pour le
  # même commit — exactement le doublon qu'on venait de supprimer des
  # déclencheurs. Ce job ne calcule rien : il interroge l'API et attend un
  # verdict.
  #
  # Pas d'interblocage possible : les chemins qui déclenchent ce workflow
  # (`nexusrh_ci/**`) déclenchent aussi `ci.yml`, qui couvre en plus
  # `.github/workflows/**`. Un run de qualité existe donc toujours pour un
  # commit qui arrive ici.
  quality-gate:
    name: Tests du commit (Quality & Security)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - name: Attendre le verdict des tests
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.ignorer_les_tests != true }}
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # Deux délais distincts, parce que les deux pannes sont différentes :
        # un run qui n'APPARAÎT jamais (workflow non déclenché) se constate en
        # quelques minutes ; un run qui tourne, lui, a besoin du temps des
        # tests. Un seul délai long aurait fait attendre 45 minutes pour
        # conclure à une absence.
        limite_apparition=$(( $(date +%s) + 600 ))
        limite_verdict=$(( $(date +%s) + 3600 ))
        vu=0

        while : ; do
          # Sans --paginate : avec --jq, gh concatene la sortie page par page
          # et produit plusieurs tableaux JSON colles, que `jq length`
          # refuse. Un commit n'a de toute facon jamais 100 runs.
          reponse=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {status, conclusion, html_url}]')

          nombre=$(printf '%s' "$reponse" | jq 'length')

          if [ "$nombre" -eq 0 ]; then
            if [ "$(date +%s)" -ge "$limite_apparition" ]; then
              echo "::error::Aucun run « Quality & Security » pour le commit ${SHA}. Le déploiement est refusé : rien ne prouve que ce commit passe les tests."
              exit 1
            fi
            echo "En attente du démarrage de « Quality & Security » pour ${SHA}…"
            sleep 20
            continue
          fi

          if [ "$vu" -eq 0 ]; then
            echo "$nombre run(s) trouvé(s) pour ${SHA}."
            vu=1
          fi

          # Un seul run vert suffit : selon la façon dont la PR a été fusionnée,
          # le verdict peut venir de l'événement `push` ou de `pull_request`,
          # sur le même arbre.
          if [ "$(printf '%s' "$reponse" | jq '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
            echo "Tests verts pour ${SHA} : le déploiement peut partir."
            printf '%s' "$reponse" | jq -r '.[] | "\(.conclusion // .status)\t\(.html_url)"'
            exit 0
          fi

          # Plus rien en cours et aucun succès : inutile d'attendre l'heure.
          if [ "$(printf '%s' "$reponse" | jq '[.[] | select(.status != "completed")] | length')" -eq 0 ]; then
            echo "::error::Les tests du commit ${SHA} ne sont pas verts — déploiement refusé."
            printf '%s' "$reponse" | jq -r '.[] | "\(.conclusion // .status)\t\(.html_url)"' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$(date +%s)" -ge "$limite_verdict" ]; then
            echo "::error::Les tests du commit ${SHA} n'ont pas rendu de verdict en une heure — déploiement refusé par prudence."
            exit 1
          fi
          echo "Tests en cours pour ${SHA}…"
          sleep 20
        done

    # Une sortie de secours qui ne laisse aucun doute sur ce qui a été fait :
    # un déploiement non testé doit se lire dans l'historique du run.
    - name: Déploiement sans tests (demandé explicitement)
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.ignorer_les_tests == true }}
      run: |
        echo "::warning::Déploiement lancé SANS attendre les tests, à la demande de ${{ github.actor }}."
        echo "⚠️ Les tests n'ont pas été exigés pour ce déploiement (demandé par ${{ github.actor }})." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    # Le contrôle précède le BUILD, et pas seulement le déploiement : ce job
    # pousse aussi le tag `:latest`, et les déploiements tirent `:latest` avec
    # `imagePullPolicy: Always`. Une image publiée depuis un commit non testé
    # partirait en production au premier `rollout restart`, sans repasser par
    # ici.
    needs: [ quality-gate ]
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
      owner: ${{ steps.owner.outputs.name }}
    steps:
    - uses: actions/checkout@v4

    - name: Short SHA
      id: sha
      run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Lowercase owner
      id: owner
      run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Prepare SARIF directory
      if: always()
      run: mkdir -p sarif-results

    - uses: pnpm/action-setup@v4
      with:
        version: '9.1.0'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: nexusrh_ci/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: nexusrh_ci

    - name: Build shared package
      run: pnpm --filter @nexusrhci/shared run build
      working-directory: nexusrh_ci

    - name: Build API (TypeScript → dist)
      run: pnpm --filter @nexusrhci/api run build
      working-directory: nexusrh_ci

    - name: Build Web (Vite → dist)
      run: pnpm --filter @nexusrhci/web run build
      working-directory: nexusrh_ci

    - name: Build Worker (TypeScript → dist)
      run: pnpm --filter @nexusrhci/worker run build
      working-directory: nexusrh_ci

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # --- Build & Scan API ---
    - name: Build & Push API
      uses: docker/build-push-action@v6
      with:
        context: ./nexusrh_ci
        file: ./nexusrh_ci/apps/api/Dockerfile
        push: true
        no-cache: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-api:sha-${{ steps.sha.outputs.short }}
          ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-api:latest

    - name: Trivy scan API
      id: trivy-api
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-api:sha-${{ steps.sha.outputs.short }}
        format: sarif
        output: sarif-results/trivy-api.sarif
        severity: CRITICAL,HIGH

    # --- Build & Scan Web ---
    - name: Build & Push Web
      uses: docker/build-push-action@v6
      with:
        context: ./nexusrh_ci
        file: ./nexusrh_ci/apps/web/Dockerfile
        push: true
        no-cache: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-web:sha-${{ steps.sha.outputs.short }}
          ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-web:latest

    - name: Trivy scan Web
      id: trivy-web
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-web:sha-${{ steps.sha.outputs.short }}
        format: sarif
        output: sarif-results/trivy-web.sarif
        severity: CRITICAL,HIGH

    # --- Build & Scan Worker ---
    - name: Build & Push Worker
      uses: docker/build-push-action@v6
      with:
        context: ./nexusrh_ci
        file: ./nexusrh_ci/apps/worker/Dockerfile
        push: true
        no-cache: true
        tags: |
          ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-worker:sha-${{ steps.sha.outputs.short }}
          ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-worker:latest

    - name: Trivy scan Worker
      id: trivy-worker
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/nexusrh-ci-worker:sha-${{ steps.sha.outputs.short }}
        format: sarif
        output: sarif-results/trivy-worker.sarif
        severity: CRITICAL,HIGH

    - name: Upload SARIF — Worker
      uses: github/codeql-action/upload-sarif@v4
      if: always() && steps.trivy-worker.outcome == 'success'
      with:
        sarif_file: sarif-results/trivy-worker.sarif
        category: trivy-worker

    - name: Upload SARIF — API
      uses: github/codeql-action/upload-sarif@v4
      if: always() && steps.trivy-api.outcome == 'success'
      with:
        sarif_file: sarif-results/trivy-api.sarif
        category: trivy-api

    - name: Upload SARIF — Web
      uses: github/codeql-action/upload-sarif@v4
      if: always() && steps.trivy-web.outcome == 'success'
      with:
        sarif_file: sarif-results/trivy-web.sarif
        category: trivy-web

  deploy:
    name: Deploy → ${{ github.event.inputs.target || 'preprod' }}
    runs-on: ubuntu-latest
    needs: [ build ]
    environment: ${{ github.event.inputs.target || 'preprod' }}
    steps:
    # L'API Kubernetes (6443) est FERMÉE à Internet par une règle nftables
    # (durcissement délibéré : une API k8s exposée est une cible de premier
    # ordre). Un runner GitHub ne peut donc pas piloter le cluster à distance —
    # c'est ce qui faisait échouer ce job en `dial tcp 6443: i/o timeout`.
    # Le runner ouvre désormais une session SSH ; tout le déploiement (helm,
    # rollout, seed) s'exécute SUR le serveur, via /usr/local/bin/nexusrh-deploy.sh.
    #
    # La clé de déploiement est verrouillée par une commande forcée dans
    # authorized_keys : elle ne peut RIEN faire d'autre que lancer ce script,
    # et seul l'argument « deploy <sha40> » est accepté. Le script refuse par
    # ailleurs de déployer un chart qui ne viserait pas le namespace nexusrh-ci
    # ou dont l'exception WAF aurait disparu.
    - name: Configurer l'accès SSH
      env:
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      run: |
        if [ -z "$DEPLOY_SSH_KEY" ]; then echo "❌ secret DEPLOY_SSH_KEY vide"; exit 1; fi
        if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then echo "❌ secret DEPLOY_KNOWN_HOSTS vide"; exit 1; fi
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # Clé d'hôte épinglée (et non ssh-keyscan à chaque exécution, qui
        # accepterait n'importe quel serveur se présentant à cette adresse).
        echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Déployer sur le serveur (helm + rollout + seed)
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        SHA: ${{ github.sha }}
      run: |
        if [ -z "$DEPLOY_HOST" ]; then echo "❌ secret DEPLOY_HOST vide"; exit 1; fi
        echo "▶ Déploiement du commit $SHA sur $DEPLOY_HOST"
        ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 root@"$DEPLOY_HOST" "deploy $SHA"

    - name: Nettoyer la clé
      if: always()
      run: rm -f ~/.ssh/deploy_key
