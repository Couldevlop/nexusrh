server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolver injecté dynamiquement par docker-entrypoint.sh depuis /etc/resolv.conf
    # Requis pour que proxy_pass avec variable $api_backend ne bloque pas le démarrage nginx
    include /tmp/kube-resolver.conf;

    # En-têtes de sécurité communs (voir security-headers.conf). Répétés dans
    # chaque location qui déclare ses propres add_header : nginx REMPLACE les
    # en-têtes hérités au lieu de les cumuler.
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy vers l'API — variable pour résolution DNS à la requête (pas au démarrage)
    set $api_backend http://api-svc.nexusrh-ci.svc.cluster.local:4001;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # index.html — jamais mis en cache (point d'entrée SPA). C'est CE bloc qui
    # sert le document de la SPA (le fallback try_files y retombe) : sans les
    # en-têtes ci-dessous, la page part sans CSP.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
        try_files $uri =404;
    }

    # Assets Vite (noms hachés) — cache long + try_files strict
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # React Router — fallback index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OWASP A02 — Cache-Control no-store sur bulletins paie PDF / exports CSV /
    # déclarations XML reçus via le proxy /api/* (évite la fuite via cache navigateur
    # partagé sur poste RH). L'API backend pose déjà ces headers ; nginx les conserve.

    location = /favicon.ico { access_log off; log_not_found off; }
}
