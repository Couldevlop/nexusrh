server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolver injecté dynamiquement par docker-entrypoint.sh depuis /etc/resolv.conf
    # Requis pour que proxy_pass avec variable $api_backend ne bloque pas le démarrage nginx
    include /tmp/kube-resolver.conf;

    # En-têtes de sécurité communs (voir security-headers.conf). Répétés dans
    # chaque location qui déclare ses propres add_header : nginx REMPLACE les
    # en-têtes hérités au lieu de les cumuler.
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy vers l'API — variable pour résolution DNS à la requête (pas au démarrage)
    set $api_backend http://api-svc.nexusrh-ci.svc.cluster.local:4001;
    location /api/ {
        # SEO — l'API n'a rien à faire dans un index (en-têtes de sécurité
        # répétés : un add_header local remplace ceux hérités du server).
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # index.html — jamais mis en cache (point d'entrée SPA). C'est CE bloc qui
    # sert le document de la SPA (le fallback try_files y retombe) : sans les
    # en-têtes ci-dessous, la page part sans CSP.
    # SEO — c'est le gabarit de l'APPLICATION (toutes les routes hors vitrine) :
    # jamais indexé, en plus de la balise meta robots du document.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag  "noindex, nofollow"                   always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
        try_files $uri =404;
    }

    # Pages publiques PRÉ-GÉNÉRÉES au build (scripts/prerender.mjs) : seules
    # pages indexables. HTML complet pour les robots, puis le bundle reprend la
    # main. Jamais en cache (elles pointent vers les assets hachés du build).
    # Repli sur le gabarit SPA si le fichier manque (build sans pré-rendu).
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /home.html /index.html;
    }
    location ^~ /legal/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri.html /index.html;
    }
    # Pages de contenu pré-générées (src/pages/public/seo/paths.ts) : même
    # traitement que les pages légales. Liste fermée de motifs : aucune route de
    # l'application ne peut tomber ici par accident.
    location ~ ^/(logiciel-paie-[a-z-]+|gestion-conges-cote-divoire|paiement-salaires-mobile-money|sirh-afrique-ouest|guides/[a-z0-9-]+|en/[a-z0-9-]+)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri.html /index.html;
    }

    # Assets Vite (noms hachés) — cache long + try_files strict
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Médias de la page vitrine (vidéo de présentation). Sans ce bloc, un
    # fichier absent tomberait dans le fallback SPA et renverrait index.html
    # en 200 : le lecteur recevrait du HTML et échouerait en silence. Cache
    # long ET immuable : l'URL porte une empreinte de contenu émise par le
    # build, donc un remplacement de la vidéo change son adresse. En-têtes de
    # sécurité répétés — nginx ne les hérite pas dans un location qui déclare
    # ses propres add_header.
    location ~* \.(mp4|webm|ogg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React Router — fallback index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OWASP A02 — Cache-Control no-store sur bulletins paie PDF / exports CSV /
    # déclarations XML reçus via le proxy /api/* (évite la fuite via cache navigateur
    # partagé sur poste RH). L'API backend pose déjà ces headers ; nginx les conserve.

    location = /favicon.ico { access_log off; log_not_found off; }
}
