# En-têtes de sécurité (OWASP A05 — Security Misconfiguration)
# ATTENTION nginx : un `location` qui déclare ses propres `add_header` REMPLACE
# ceux hérités du bloc `server` au lieu de s'y ajouter. Ce fichier est donc
# inclus dans le `server` ET dans chaque `location` qui pose un add_header,
# faute de quoi la réponse part sans CSP (bug constaté : l'ingress mutualisé
# retombait alors sur sa CSP globale, `frame-src` sans blob:, et le navigateur
# bloquait l'<iframe> d'aperçu du bulletin de paie).
# Note : `always` requis pour qu'ils s'appliquent aussi sur 4xx/5xx.
add_header X-Content-Type-Options       "nosniff"                                                   always;
add_header X-Frame-Options              "DENY"                                                      always;
add_header X-XSS-Protection             "0"                                                         always;
add_header Referrer-Policy              "strict-origin-when-cross-origin"                           always;
add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()"      always;
add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload"              always;
add_header Cross-Origin-Resource-Policy "same-origin"                                               always;
add_header Cross-Origin-Opener-Policy   "same-origin"                                               always;

# Content-Security-Policy — calibrée pour SPA Vite + Tailwind
# - script-src: 'self' uniquement (pas de CDN scripts)
# - style-src: 'self' + 'unsafe-inline' (Tailwind JIT + composants shadcn)
# - img-src: 'self' + data: (logos SVG inline tenant) + https: (avatars éventuels)
# - connect-src: 'self' (API via /api/* proxy nginx)
# - frame-src: 'self' + blob: — aperçu des bulletins PDF affichés en <iframe>
#   via une URL blob: générée côté front (même-origine). Sans blob: dans
#   frame-src, la directive retombe sur default-src 'self' qui n'autorise pas
#   le schéma blob: → le navigateur bloque l'aperçu ("Ce contenu est bloqué").
#   object-src reste 'none' (aucun <object>/<embed>), frame-ancestors 'none'
#   inchangé : le durcissement anti-clickjacking n'est pas affaibli.
# - frame-ancestors 'none' = même protection que X-Frame-Options: DENY
# - upgrade-insecure-requests pour forcer HTTPS si HSTS appliqué
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
